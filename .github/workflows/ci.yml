name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SwedishTax.slnx

      - name: Build
        run: dotnet build SwedishTax.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SwedishTax.slnx --configuration Release --no-build
